<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Inverter and battery backup</title>
  <desc id="desc">A generated photo-style image of an inverter and battery backup system in a clean utility room.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1">
      <stop offset="0" stop-color="#f2e1c9"/>
      <stop offset=".48" stop-color="#d6d2ca"/>
      <stop offset="1" stop-color="#6d7378"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
